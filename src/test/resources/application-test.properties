# Requiere PostgreSQL local. Define TEST_DB_PASSWORD si la autenticacion local la requiere.
# export TEST_DB_USERNAME=postgres
# export TEST_DB_PASSWORD='contraseña local'
# Si la base no existe, crearla manualmente con: CREATE DATABASE legalai_test;
spring.datasource.url=jdbc:postgresql://localhost:5432/legalai_test
spring.datasource.username=${TEST_DB_USERNAME:postgres}
spring.datasource.password=${TEST_DB_PASSWORD:}
spring.datasource.password=${TEST_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
app.jwt.secret=test-only-secret-not-for-deployment-legalai-2026
app.jwt.expiration-ms=3600000
