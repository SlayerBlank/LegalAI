spring.application.name=LegalAI
legalai.documents.max-file-size=${LEGALAI_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-file-size=${legalai.documents.max-file-size}
spring.servlet.multipart.max-request-size=${LEGALAI_MAX_REQUEST_SIZE:12MB}
legalai.storage.path=${LEGALAI_STORAGE_PATH:uploads}
legalai.rag.chunk-size=${LEGALAI_CHUNK_SIZE:2500}
legalai.rag.chunk-overlap=${LEGALAI_CHUNK_OVERLAP:300}

spring.jpa.database=postgresql
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:LegalBD}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

app.jwt.secret=${JWT_SECRET:}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
server.forward-headers-strategy=framework

gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
gemini.fallback-model=${GEMINI_FALLBACK_MODEL:gemini-3.5-flash}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
gemini.connect-timeout=${GEMINI_CONNECT_TIMEOUT:5s}
gemini.request-timeout=${GEMINI_REQUEST_TIMEOUT:30s}

gemini.embedding.model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
legalai.embedding.dimension=${LEGALAI_EMBEDDING_DIMENSION:768}
legalai.embedding.batch-size=${LEGALAI_EMBEDDING_BATCH_SIZE:1}

legalai.rag.default-top-k=${LEGALAI_RAG_TOP_K:5}
legalai.rag.max-context-chars=${LEGALAI_RAG_MAX_CONTEXT_CHARS:12000}
legalai.rag.max-cosine-distance=${LEGALAI_RAG_MAX_COSINE_DISTANCE:}

legalai.chat.max-history-messages=${LEGALAI_CHAT_MAX_HISTORY_MESSAGES:10}
legalai.chat.max-message-chars=${LEGALAI_CHAT_MAX_MESSAGE_CHARS:2000}
legalai.chat.default-page-size=${LEGALAI_CHAT_DEFAULT_PAGE_SIZE:20}
legalai.chat.max-page-size=${LEGALAI_CHAT_MAX_PAGE_SIZE:100}
legalai.chat.query-rewrite=${LEGALAI_CHAT_QUERY_REWRITE:heuristic}
